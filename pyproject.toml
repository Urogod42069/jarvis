[project]
name = "jarvis"
version = "0.1.0"
description = "Jarvis — personal AI assistant powered by Claude"
requires-python = ">=3.9"
dependencies = [
    "anthropic>=0.39.0",
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]

[project.scripts]
jarvis = "jarvis.__main__:main"
jarvis-api = "jarvis.api:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"
